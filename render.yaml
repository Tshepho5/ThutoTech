# Render Blueprint for ThutoTech Ecosystem
version: "1"

services:
  # 1. Backend REST API Service
  - type: web
    name: thutotech-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: thutotech-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: thutotech.admin@gmail.com

databases:
  # 2. Managed PostgreSQL Database
  - name: thutotech-postgres
    plan: free
    databaseName: ThutoTech_DB
    user: postgres
    region: frankfurt
