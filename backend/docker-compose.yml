version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: thutotech_postgres
    restart: always
    environment:
      POSTGRES_USER: thutotech_user
      POSTGRES_PASSWORD: thutotech_secure_pass
      POSTGRES_DB: thutotech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: thutotech_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thutotech.co.za
      PGADMIN_DEFAULT_PASSWORD: admin_password_2026
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
