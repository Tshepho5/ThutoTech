[package]
name = "thutotech-desktop"
version = "2.0.0"
description = "ThutoTech Digital School Ecosystem Desktop"
authors = ["Lebogang Makola <thutotech.admin@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "http-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
